name: Build APK Tablet Play

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/TabletPlay.apk' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Simpan log kalau build gagal
        if: failure()
        run: |
          mkdir -p tools
          grep -n -i -B2 -A12 "error\|failed\|what went wrong" build.log | head -400 > tools/build-log.txt || tail -300 build.log > tools/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-log.txt
          git commit -m "Log build gagal [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/TabletPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TabletPlay-apk
          path: out/TabletPlay.apk

      - name: Simpan APK ke docs (bisa diunduh dari GitHub Pages)
        run: |
          cp out/TabletPlay.apk docs/TabletPlay.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TabletPlay.apk
          git commit -m "APK terbaru [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
